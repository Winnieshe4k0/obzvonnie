<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>База Обзвона</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='bg2' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%23FFC107'/%3E%3Cstop offset='100%25' stop-color='%23FF9800'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='url(%23bg2)'/%3E%3Cpath d='M20 20a24 24 0 0 1 24 24' stroke='%231a1a2e' stroke-width='4' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='20' cy='20' r='5' fill='%231a1a2e'/%3E%3Ccircle cx='44' cy='44' r='5' fill='%231a1a2e'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
  :root {
    --main: #FFC107;
    --main-dark: #E6A800;
    --main-darker: #B8860B;
    --main-light: #FFD54F;
    --main-pale: #FFF8E1;
    --main-ghost: #FFFBEF;
    --accent: #FF3A1F;
    --text: #1a1a2e;
    --text-muted: #6b7599;
    --border: #ece2c8;
    --surface: #fdfbf5;
    --success: #00b87a;
    --warning: #f59e0b;
    --shadow: 0 4px 24px rgba(184,134,11,0.12);
    --shadow-lg: 0 12px 48px rgba(184,134,11,0.22);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: var(--surface); color: var(--text); min-height: 100vh; }

  /* HEADER */
  header {
    background: linear-gradient(120deg, var(--main), var(--main-dark));
    color: var(--text);
    padding: 0 24px; height: 64px;
    display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; z-index: 100;
    box-shadow: var(--shadow-lg);
  }
  .logo { font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 16px; letter-spacing: .02em; display:flex; align-items:center; gap:10px; }
  .logo-dot { width: 9px; height: 9px; background: var(--text); border-radius: 50%; }
  .header-actions { display: flex; gap: 8px; align-items: center; }
  .btn {
    border: none; border-radius: 8px; padding: 8px 16px;
    font-family: 'Unbounded', sans-serif; font-size: 11px; font-weight: 600;
    cursor: pointer; display: flex; align-items: center; gap: 6px;
    transition: all .2s; white-space: nowrap;
  }
  .btn-dark { background: var(--text); color: var(--main-light); }
  .btn-dark:hover { background: #2a2a45; transform: translateY(-1px); }
  .btn-white { background: rgba(26,26,46,.12); color: var(--text); }
  .btn-white:hover { background: rgba(26,26,46,.2); }
  input[type=file] { display: none; }

  /* TABS */
  .tabs-bar {
    background: white; border-bottom: 2px solid var(--main);
    padding: 0 24px; display: flex; gap: 4px; overflow-x: auto;
  }
  .tab-btn {
    padding: 12px 18px; border: none; background: none; cursor: pointer;
    font-family: 'Unbounded', sans-serif; font-size: 11px; font-weight: 600;
    color: var(--text-muted); white-space: nowrap; border-bottom: 3px solid transparent;
    transition: all .15s;
  }
  .tab-btn:hover { color: var(--text); background: var(--main-ghost); }
  .tab-btn.active { color: var(--main-darker); border-bottom-color: var(--main); }
  .tab-count { display:inline-block; background: var(--main-pale); color: var(--main-darker); border-radius: 10px; padding: 1px 7px; font-size: 10px; margin-left: 5px; }
  .tab-btn.active .tab-count { background: var(--main); color: var(--text); }

  /* STATS */
  .stats-bar { background: var(--text); color: white; padding: 10px 24px; display: flex; gap: 28px; flex-wrap: wrap; align-items: center; }
  .stat-item { display: flex; align-items: center; gap: 8px; }
  .stat-num { font-family: 'Unbounded', sans-serif; font-size: 18px; font-weight: 700; color: var(--main); }
  .stat-label { font-size: 11px; color: rgba(255,255,255,.65); line-height: 1.3; }

  /* TOOLBAR */
  .toolbar { background: white; border-bottom: 1px solid var(--border); padding: 12px 24px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .search-wrap { position: relative; flex: 1; min-width: 200px; max-width: 320px; }
  .search-wrap svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text-muted); pointer-events: none; }
  .search-input { width: 100%; padding: 8px 12px 8px 34px; border: 1.5px solid var(--border); border-radius: 8px; font-size: 13px; font-family: 'Inter', sans-serif; outline: none; background: var(--surface); }
  .search-input:focus { border-color: var(--main-dark); }
  .filter-select { padding: 8px 12px; border: 1.5px solid var(--border); border-radius: 8px; font-size: 13px; font-family: 'Inter', sans-serif; outline: none; cursor: pointer; background: var(--surface); color: var(--text); }
  .filter-select:focus { border-color: var(--main-dark); }

  .result-count { font-size: 12px; color: var(--text-muted); padding: 8px 24px 0; }
  .result-count strong { color: var(--text); }

  /* TABLE */
  .table-wrap { padding: 14px 24px 24px; overflow-x: auto; }
  table { width: 100%; border-collapse: separate; border-spacing: 0; background: white; border-radius: 12px; overflow: hidden; box-shadow: var(--shadow); }
  thead tr { background: var(--text); color: var(--main-light); }
  thead th { padding: 12px 14px; text-align: left; font-family: 'Unbounded', sans-serif; font-size: 10px; font-weight: 600; letter-spacing: .04em; white-space: nowrap; text-transform: uppercase; }
  tbody tr { border-bottom: 1px solid var(--main-ghost); transition: background .15s; }
  tbody tr:nth-child(odd) { background: white; }
  tbody tr:nth-child(even) { background: #fffdf5; }
  tbody tr:hover { background: var(--main-pale) !important; }
  td { padding: 10px 14px; font-size: 13px; vertical-align: top; max-width: 240px; }
  .muted { color: #ccc; }

  .company-cell { cursor: pointer; }
  .company-name { font-weight: 600; font-size: 13.5px; color: var(--text); }
  .company-name:hover { color: var(--main-darker); text-decoration: underline; }
  .city-badge { display: inline-block; margin-top: 4px; font-size: 10px; font-weight: 600; padding: 1px 7px; border-radius: 20px; background: var(--main-pale); color: var(--main-darker); }
  .city-badge.spb { background: #e0f7fa; color: #0891b2; }
  .city-badge.both { background: #f3e8ff; color: #7c3aed; }

  .phone-row { display: flex; align-items: baseline; gap: 6px; font-size: 12.5px; margin-bottom: 3px; white-space: nowrap; }
  .phone-num { font-family: 'Courier New', monospace; color: var(--text); }
  .phone-label { font-size: 10px; color: var(--text-muted); background: var(--main-ghost); border-radius: 8px; padding: 0 6px; }

  .status-select { border: 1.5px solid transparent; border-radius: 20px; padding: 4px 10px; font-size: 11px; font-weight: 600; font-family: 'Inter', sans-serif; cursor: pointer; outline: none; appearance: none; -webkit-appearance: none; }

  .inline-date { border: 1.5px solid var(--border); border-radius: 6px; padding: 4px 6px; font-size: 12px; font-family: 'Inter', sans-serif; background: var(--surface); color: var(--text); outline: none; }
  .inline-date:focus { border-color: var(--main-dark); }
  .connect-wrap { display: flex; align-items: center; gap: 6px; }
  .due-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 3px rgba(255,58,31,.2); animation: pulse 1.6s infinite; flex-shrink: 0; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .4; } }

  .notes-cell { font-size: 12px; color: #444; max-width: 260px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .notes-date { font-size: 10px; color: var(--text-muted); margin-right: 4px; }
  .comment-count-badge { font-size: 10px; background: var(--main-pale); color: var(--main-darker); border-radius: 10px; padding: 1px 6px; margin-left: 4px; }

  .row-actions { display: flex; gap: 4px; white-space: nowrap; }
  .btn-icon { border: none; background: none; cursor: pointer; padding: 5px; border-radius: 6px; display: flex; align-items: center; color: var(--text-muted); }
  .btn-icon:hover { background: var(--main-pale); color: var(--main-darker); }
  .btn-icon.danger:hover { background: #fee2e2; color: var(--accent); }

  /* MODAL */
  .modal-overlay { position: fixed; inset: 0; background: rgba(20,15,0,.5); backdrop-filter: blur(4px); z-index: 1000; display: none; align-items: center; justify-content: center; padding: 20px; }
  .modal-overlay.open { display: flex; }
  .modal { background: white; border-radius: 16px; width: 100%; max-width: 640px; max-height: 90vh; overflow-y: auto; box-shadow: var(--shadow-lg); animation: slideUp .25s ease; }
  @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } }
  .modal-header { background: linear-gradient(120deg, var(--main), var(--main-dark)); color: var(--text); padding: 18px 24px; border-radius: 16px 16px 0 0; display: flex; align-items: center; justify-content: space-between; }
  .modal-title { font-family: 'Unbounded', sans-serif; font-size: 14px; font-weight: 600; }
  .modal-close { background: rgba(26,26,46,.15); border: none; color: var(--text); width: 30px; height: 30px; border-radius: 50%; cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center; }
  .modal-close:hover { background: rgba(26,26,46,.28); }
  .modal-body { padding: 22px 24px; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 540px) { .form-grid { grid-template-columns: 1fr; } }
  .field-full { grid-column: 1 / -1; }
  .form-label { display: block; font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 5px; }
  .form-input, .form-select, .form-textarea { width: 100%; padding: 9px 12px; border: 1.5px solid var(--border); border-radius: 8px; font-size: 13px; font-family: 'Inter', sans-serif; outline: none; background: var(--surface); color: var(--text); }
  .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--main-dark); }
  .form-textarea { resize: vertical; min-height: 70px; }
  .form-section { margin-bottom: 18px; }
  .form-section-title { font-family: 'Unbounded', sans-serif; font-size: 10px; font-weight: 600; color: var(--main-darker); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 10px; padding-bottom: 6px; border-bottom: 1.5px solid var(--main-pale); }
  .modal-footer { padding: 14px 24px; border-top: 1px solid var(--border); display: flex; gap: 10px; justify-content: flex-end; }
  .btn-cancel { padding: 10px 20px; border: 1.5px solid var(--border); background: white; border-radius: 8px; font-family: 'Inter', sans-serif; font-size: 13px; cursor: pointer; color: var(--text-muted); }
  .btn-cancel:hover { border-color: var(--text-muted); color: var(--text); }
  .btn-save { padding: 10px 22px; background: var(--text); color: var(--main-light); border: none; border-radius: 8px; font-family: 'Unbounded', sans-serif; font-size: 11px; font-weight: 600; cursor: pointer; }
  .btn-save:hover { background: #2a2a45; }

  .phone-row-edit { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
  .phone-row-edit input:first-child { flex: 1.2; }
  .phone-row-edit input:last-child { flex: 1; }
  .phone-remove { background: none; border: none; cursor: pointer; color: var(--text-muted); font-size: 16px; padding: 4px 8px; border-radius: 6px; }
  .phone-remove:hover { color: var(--accent); background: rgba(255,58,31,.1); }
  .btn-add-phone { background: var(--main-ghost); border: 1.5px dashed var(--main-dark); color: var(--main-darker); border-radius: 8px; padding: 7px 14px; font-size: 12px; cursor: pointer; font-weight: 600; }
  .btn-add-phone:hover { background: var(--main-pale); }

  .comment-item { background: var(--main-ghost); border-radius: 8px; padding: 9px 12px; border-left: 3px solid var(--main-dark); margin-bottom: 8px; }
  .comment-date { font-size: 10px; font-weight: 600; color: var(--main-darker); text-transform: uppercase; letter-spacing: .03em; margin-bottom: 3px; }
  .comment-text { font-size: 13px; color: var(--text); line-height: 1.5; white-space: pre-line; }
  .comment-del { float: right; background: none; border: none; cursor: pointer; color: var(--text-muted); font-size: 13px; }
  .comment-del:hover { color: var(--accent); }

  /* CONFIRM */
  #confirmOverlay { position: fixed; inset: 0; background: rgba(20,15,0,.55); backdrop-filter: blur(4px); z-index: 2000; display: none; align-items: center; justify-content: center; }
  #confirmOverlay.open { display: flex; }
  #confirmBox { background: white; border-radius: 14px; padding: 30px 26px 22px; max-width: 380px; width: 90%; box-shadow: var(--shadow-lg); text-align: center; }
  #confirmBox .confirm-icon { font-size: 34px; margin-bottom: 10px; }
  #confirmBox h3 { font-family: 'Unbounded', sans-serif; font-size: 14px; margin-bottom: 8px; }
  #confirmBox p { font-size: 13px; color: var(--text-muted); margin-bottom: 22px; }
  #confirmBox .confirm-btns { display: flex; gap: 10px; justify-content: center; }
  .cbtn-yes { background: var(--accent); color: white; border: none; border-radius: 8px; padding: 10px 26px; font-family: 'Unbounded', sans-serif; font-size: 11px; font-weight: 600; cursor: pointer; }
  .cbtn-no { background: #f0f0f0; color: var(--text); border: none; border-radius: 8px; padding: 10px 26px; font-family: 'Unbounded', sans-serif; font-size: 11px; font-weight: 600; cursor: pointer; }

  .toast { position: fixed; bottom: 24px; right: 24px; background: var(--text); color: var(--main-light); padding: 12px 20px; border-radius: 10px; font-size: 13px; font-weight: 500; box-shadow: var(--shadow-lg); z-index: 9999; display: none; }
  .toast.show { display: block; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); }
  .empty-state h3 { font-family: 'Unbounded', sans-serif; font-size: 14px; margin: 12px 0 6px; }

  @media (max-width: 768px) {
    header { padding: 0 10px; height: 56px; }
    .logo { font-size: 12px; }
    .btn { padding: 6px 10px; font-size: 10px; }
    .tabs-bar { padding: 0 8px; }
    .tab-btn { padding: 10px 12px; font-size: 10px; }
    .stats-bar { padding: 8px 10px; gap: 14px; overflow-x: auto; flex-wrap: nowrap; }
    .toolbar { padding: 8px 10px; flex-direction: column; align-items: stretch; }
    .search-wrap { max-width: 100%; }
    .table-wrap { padding: 8px 0; }
    table { min-width: 680px; border-radius: 0; }
    td, thead th { padding: 8px; font-size: 12px; }
    .modal-overlay { padding: 0; align-items: flex-end; }
    .modal { max-width: 100%; max-height: 95vh; border-radius: 16px 16px 0 0; }
  }
</style>
</head>
<body>

<header>
  <div class="logo"><div class="logo-dot"></div><span>БАЗА ОБЗВОНА</span><span id="syncIcon" style="font-size:14px;margin-left:4px" title="Синхронизация...">🔄</span></div>
  <div class="header-actions">
    <button class="btn btn-white" onclick="document.getElementById('importInput').click()">⬆ Импорт</button>
    <input type="file" id="importInput" accept=".xlsx,.xls,.csv" onchange="handleImportFile(event)">
    <button class="btn btn-white" onclick="exportSheet()">⬇ Экспорт</button>
    <button class="btn btn-dark" onclick="openAddModal()">+ Добавить</button>
  </div>
</header>

<div class="tabs-bar" id="tabsBar"></div>

<div class="stats-bar" id="statsBar"></div>

<div class="toolbar">
  <div class="search-wrap">
    <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="text" class="search-input" placeholder="Поиск: компания, ЛПР, телефон, комментарий..." id="searchInput" oninput="renderTable()">
  </div>
  <select class="filter-select" id="filterCity" onchange="renderTable()">
    <option value="">Все города</option>
    <option value="МСК">МСК</option>
    <option value="СПБ">СПБ</option>
    <option value="МСК/СПБ">МСК/СПБ</option>
  </select>
  <select class="filter-select" id="filterStatus" onchange="renderTable()">
    <option value="">Все статусы</option>
  </select>
  <select class="filter-select" id="filterConnect" onchange="renderTable()">
    <option value="">Связаться: все</option>
    <option value="due">Сегодня / просрочено</option>
    <option value="future">Будущие</option>
    <option value="none">Дата не указана</option>
  </select>
</div>

<div class="result-count" id="resultCount"></div>

<div class="table-wrap">
  <table id="mainTable">
    <thead><tr id="tableHead"></tr></thead>
    <tbody id="tableBody"></tbody>
  </table>
  <div class="empty-state" id="emptyState" style="display:none">
    <div style="font-size:44px">📞</div>
    <h3>Партнёры не найдены</h3>
    <p>Измените фильтры или добавьте нового партнёра на этот лист</p>
  </div>
</div>

<!-- ADD/EDIT MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle">Новый партнёр</div>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body">

      <div class="form-section">
        <div class="form-section-title">🏢 Основная информация</div>
        <div class="form-grid">
          <div class="field-full">
            <label class="form-label">Компания / название</label>
            <input type="text" class="form-input" id="f_company" placeholder="Название организации">
          </div>
          <div>
            <label class="form-label">Город</label>
            <select class="form-select" id="f_city">
              <option value="">—</option>
              <option value="МСК">МСК</option>
              <option value="СПБ">СПБ</option>
              <option value="МСК/СПБ">МСК/СПБ</option>
            </select>
          </div>
          <div>
            <label class="form-label">ЛПР (имя контакта)</label>
            <input type="text" class="form-input" id="f_lpr" placeholder="Имя, фамилия">
          </div>
          <div>
            <label class="form-label">Статус звонка</label>
            <select class="form-select" id="f_status"></select>
          </div>
          <div>
            <label class="form-label">Связаться (дата)</label>
            <input type="date" class="form-input" id="f_connect">
          </div>
        </div>
      </div>

      <div class="form-section">
        <div class="form-section-title">📞 Телефоны</div>
        <div id="phoneRows"></div>
        <button type="button" class="btn-add-phone" onclick="addPhoneRow()">+ Добавить номер</button>
      </div>

      <div class="form-section">
        <div class="form-section-title">💬 Комментарий (результат звонка)</div>
        <div class="form-grid">
          <div>
            <label class="form-label">Дата контакта</label>
            <input type="date" class="form-input" id="f_comment_date">
          </div>
          <div class="field-full">
            <label class="form-label">Текст</label>
            <textarea class="form-textarea" id="f_comment_text" placeholder="Что сказали, договорённости, итог звонка..."></textarea>
          </div>
        </div>
      </div>

      <div class="form-section" id="historySection" style="display:none">
        <div class="form-section-title">🕐 История звонков</div>
        <div id="commentHistory"></div>
      </div>

    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeModal()">Отмена</button>
      <button class="btn-save" onclick="savePartner()">Сохранить</button>
    </div>
  </div>
</div>

<!-- CONFIRM DELETE -->
<div id="confirmOverlay">
  <div id="confirmBox">
    <div class="confirm-icon">🗑️</div>
    <h3>Точно удалить?</h3>
    <p id="confirmText"></p>
    <div class="confirm-btns">
      <button class="cbtn-yes" onclick="confirmYes()">Да, удалить</button>
      <button class="cbtn-no" onclick="confirmNo()">Отмена</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ─── SHEET DEFINITIONS ──────────────────────────────────
const SHEET_DEFS = [
  { key: 'sk',      label: 'Строительные компании' },
  { key: 'uk',      label: 'Управляющие компании' },
  { key: 'design',  label: 'Дизайн-студии' },
  { key: 'realtor', label: 'Агентства недвижимости' },
  { key: 'shop',    label: 'Магазины' },
];
const STATUSES = ['Не берет','Не абонент','Перезвонить','Поговорили','Сбросили','Не интересно','Партнёр А','Партнёр Р'];
const STATUS_STYLE = {
  'Не берет':    { bg:'#FEF3C7', color:'#B45309' },
  'Не абонент':  { bg:'#F1F5F9', color:'#64748B' },
  'Перезвонить': { bg:'#DBEAFE', color:'#1D4ED8' },
  'Поговорили':  { bg:'#DCFCE7', color:'#15803D' },
  'Сбросили':    { bg:'#FEE2E2', color:'#B91C1C' },

// ─── FIREBASE ────────────────────────────────────────────
firebase.initializeApp({ databaseURL: 'https://obzvonni-a0d67-default-rtdb.firebaseio.com/' });
const db = firebase.database();
let fbSaveTimeout = null;
let fbReady = false;      // becomes true after first successful load from cloud
let suppressFbEcho = false; // true while we are writing, to ignore our own echo

function setSyncIcon(state) {
  const el = document.getElementById('syncIcon');
  if (!el) return;
  if (state === 'ok')      { el.textContent = '☁️'; el.title = 'Синхронизировано с облаком'; }
  else if (state === 'busy'){ el.textContent = '🔄'; el.title = 'Синхронизация...'; }
  else                      { el.textContent = '⚠️'; el.title = 'Нет связи с облаком — работаем локально'; }
}

function fbSaveDebounced() {
  setSyncIcon('busy');
  clearTimeout(fbSaveTimeout);
  fbSaveTimeout = setTimeout(() => {
    suppressFbEcho = true;
    db.ref('obzvon').set({ data: DATA, idCounter }).then(() => {
      setSyncIcon('ok');
      setTimeout(() => { suppressFbEcho = false; }, 600);
    }).catch(e => { console.error('Firebase save error:', e); setSyncIcon('err'); suppressFbEcho = false; });
  }, 400);
}

// ─── PERSISTENCE ────────────────────────────────────────
function saveState() {
  try { localStorage.setItem('obzvon_v1', JSON.stringify({ data: DATA, idCounter })); } catch(e) {}
  fbSaveDebounced();
}
function loadState() {
  try {
    const s = localStorage.getItem('obzvon_v1');
    if (s) {
      const parsed = JSON.parse(s);
      DATA = parsed.data || DATA;
      idCounter = parsed.idCounter || idCounter;
      SHEET_DEFS.forEach(s => { if (!DATA[s.key]) DATA[s.key] = []; });
      return true;
    }
  } catch(e) {}
  return false;
}

function applyRemoteData(remote) {
  if (!remote || !remote.data) return;
  DATA = remote.data;
  idCounter = remote.idCounter || idCounter;
  SHEET_DEFS.forEach(s => { if (!DATA[s.key]) DATA[s.key] = []; });
  try { localStorage.setItem('obzvon_v1', JSON.stringify({ data: DATA, idCounter })); } catch(e) {}
}

function initFirebaseSync() {
  db.ref('obzvon').once('value').then(snap => {
    const remote = snap.val();
    if (remote && remote.data) {
      // Cloud already has data — it's the source of truth
      applyRemoteData(remote);
    } else {
      // Nothing in the cloud yet — push what we have locally
      suppressFbEcho = true;
      db.ref('obzvon').set({ data: DATA, idCounter }).then(() => { setTimeout(() => { suppressFbEcho = false; }, 600); });
    }
    fbReady = true;
    setSyncIcon('ok');
    renderTabs();
    renderTable();

    // Live updates from a colleague working at the same time
    db.ref('obzvon').on('value', snap2 => {
      if (!fbReady || suppressFbEcho) return;
      const remote2 = snap2.val();
      if (!remote2 || !remote2.data) return;
      // Don't yank data out from under someone mid-edit in the modal
      if (document.getElementById('modalOverlay').classList.contains('open')) return;
      applyRemoteData(remote2);
      renderTabs();
      renderTable();
    });
  }).catch(err => {
    console.error('Firebase load error:', err);
    setSyncIcon('err');
    showToast('⚠️ Нет связи с облаком — работаем локально');
  });
}

function renderStats() {
  const rows = DATA[activeSheet];
  const today = todayStr();
  const due = rows.filter(p => p.connect && p.connect <= today).length;
  const talked = rows.filter(p => p.status === 'Поговорили').length;
  const partners = rows.filter(p => p.status === 'Партнёр А' || p.status === 'Партнёр Р').length;
  document.getElementById('statsBar').innerHTML = `
    <div class="stat-item"><div class="stat-num">${rows.length}</div><div class="stat-label">Всего<br>в списке</div></div>
    <div class="stat-item"><div class="stat-num">${due}</div><div class="stat-label">Связаться<br>сегодня</div></div>
    <div class="stat-item"><div class="stat-num">${talked}</div><div class="stat-label">Поговорили</div></div>
    <div class="stat-item"><div class="stat-num">${partners}</div><div class="stat-label">Стали<br>партнёрами</div></div>
  `;
}

function todayStr() { return new Date().toISOString().split('T')[0]; }
function fmtDate(d) { if (!d) return ''; const p = d.split('-'); return p.length===3 ? `${p[2]}.${p[1]}.${p[0].slice(2)}` : d; }
function escapeHtml(s) { return (s||'').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ─── STATUS FILTER OPTIONS ──────────────────────────────

// ─── RENDER TABLE ────────────────────────────────────────
function renderTable() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  const fCity = document.getElementById('filterCity').value;
  const fStatus = document.getElementById('filterStatus').value;
  const fConnect = document.getElementById('filterConnect').value;
  const today = todayStr();

  let rows = DATA[activeSheet].filter(p => {
    if (fCity && p.city !== fCity) return false;
    if (fStatus && p.status !== fStatus) return false;
    if (fConnect === 'due' && !(p.connect && p.connect <= today)) return false;
    if (fConnect === 'future' && !(p.connect && p.connect > today)) return false;
    if (fConnect === 'none' && p.connect) return false;
    if (q) {
      const phonesText = (p.phones||[]).map(ph => ph.number + ' ' + ph.label).join(' ');
      const commentsText = (p.comments||[]).map(c => c.text).join(' ');
      const hay = [p.company, p.lpr, phonesText, commentsText, p.city, p.status].join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });

  const thead = document.getElementById('tableHead');
  thead.innerHTML = `
    <th>Статус</th>
    <th>Компания</th>
    <th>Телефон</th>
    <th>ЛПР</th>
    <th>Связаться</th>
    <th>Посл. контакт</th>
    <th>Комментарий</th>
    <th></th>
  `;

  const tbody = document.getElementById('tableBody');
  if (!rows.length) {
    tbody.innerHTML = '';
    document.getElementById('emptyState').style.display = 'block';
    document.getElementById('mainTable').style.display = 'none';
  } else {
    document.getElementById('emptyState').style.display = 'none';
    document.getElementById('mainTable').style.display = '';
    tbody.innerHTML = rows.map(p => renderRow(p, today)).join('');
  }

  document.getElementById('resultCount').innerHTML = `<strong>${rows.length}</strong> из <strong>${DATA[activeSheet].length}</strong> на листе «${SHEET_DEFS.find(s=>s.key===activeSheet).label}»`;
  renderStats();
  renderTabs();
}

function renderRow(p, today) {
  // status select
  const st = STATUS_STYLE[p.status] || { bg:'#F5F5F5', color:'#888' };
  const statusOpts = ['', ...STATUSES].map(s => `<option value="${s}" ${p.status===s?'selected':''}>${s||'— не задан —'}</option>`).join('');
  const statusHtml = `<select class="status-select" style="background:${st.bg};color:${st.color}" onchange="updateField(${p.id},'status',this.value)">${statusOpts}</select>`;

  // company + city badge
  let cityClass = '';
  if (p.city === 'СПБ') cityClass = 'spb'; else if (p.city === 'МСК/СПБ') cityClass = 'both';
  const cityBadge = p.city ? `<div class="city-badge ${cityClass}">${p.city}</div>` : '';
  const companyHtml = `<td class="company-cell" onclick="openEditModal(${p.id})">
      <div class="company-name">${escapeHtml(p.company) || '—'}</div>${cityBadge}
    </td>`;

  // phones
  const phonesHtml = (p.phones && p.phones.length)
    ? p.phones.map(ph => `<div class="phone-row"><span class="phone-num">${escapeHtml(ph.number)}</span>${ph.label?`<span class="phone-label">${escapeHtml(ph.label)}</span>`:''}</div>`).join('')
    : '<span class="muted">—</span>';

  // connect date
  const isDue = p.connect && p.connect <= today;
  const connectHtml = `<div class="connect-wrap">
      ${isDue ? '<span class="due-dot" title="Пора связаться"></span>' : ''}
      <input type="date" class="inline-date" value="${p.connect||''}" onchange="updateField(${p.id},'connect',this.value)">
    </div>`;

  const lastcontactHtml = `<input type="date" class="inline-date" value="${p.lastcontact||''}" onchange="updateField(${p.id},'lastcontact',this.value)">`;

  // last comment
  const comments = p.comments || [];
  const last = comments[comments.length - 1];
  const countBadge = comments.length > 1 ? `<span class="comment-count-badge">+${comments.length-1}</span>` : '';
  const notesHtml = last
    ? `<div class="notes-cell" title="${escapeHtml(last.text)}"><span class="notes-date">${fmtDate(last.date)}</span>${escapeHtml(last.text)}${countBadge}</div>`
    : `<span class="muted">—</span>`;

  return `<tr>
    <td>${statusHtml}</td>
    ${companyHtml}
    <td>${phonesHtml}</td>
    <td>${escapeHtml(p.lpr) || '<span class="muted">—</span>'}</td>
    <td>${connectHtml}</td>
    <td>${lastcontactHtml}</td>
    <td>${notesHtml}</td>
    <td><div class="row-actions">
      <button class="btn-icon" onclick="openEditModal(${p.id})" title="Редактировать">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
      </button>
      <button class="btn-icon danger" onclick="deletePartner(${p.id})" title="Удалить">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/></svg>
      </button>
    </div></td>
  </tr>`;
}

function openEditModal(id) {
  const p = DATA[activeSheet].find(x => x.id === id);
  if (!p) return;
  editingId = id;
  document.getElementById('modalTitle').textContent = `✏️ ${p.company || 'Партнёр'}`;
  document.getElementById('f_company').value = p.company || '';
  document.getElementById('f_city').value = p.city || '';

  document.getElementById('f_connect').value = p.connect || '';
  document.getElementById('f_comment_date').value = todayStr();
  document.getElementById('f_comment_text').value = '';
  formPhones = p.phones && p.phones.length ? JSON.parse(JSON.stringify(p.phones)) : [{ number:'', label:'' }];
  renderPhoneRows();

  const hist = document.getElementById('commentHistory');
  const comments = (p.comments || []).slice().reverse();
  if (comments.length) {
    document.getElementById('historySection').style.display = 'block';
    hist.innerHTML = comments.map((c, ri) => {
      const realIdx = p.comments.length - 1 - ri;
      return `<div class="comment-item">
        <div class="comment-date">📅 ${fmtDate(c.date) || '—'} <button class="comment-del" onclick="deleteComment(${realIdx})">🗑</button></div>
        <div class="comment-text">${escapeHtml(c.text)}</div>
      </div>`;
    }).join('');
  } else {
    document.getElementById('historySection').style.display = 'none';
  }

  document.getElementById('modalOverlay').classList.add('open');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
  editingId = null;
}

function deleteComment(idx) {
  if (editingId === null) return;
  const p = DATA[activeSheet].find(x => x.id === editingId);
  if (!p || !p.comments) return;
  p.comments.splice(idx, 1);
  saveState();
  openEditModal(editingId);
  renderTable();
  showToast('🗑 Запись удалена');
}

// ─── SAVE ────────────────────────────────────────────────
function savePartner() {
  const company = document.getElementById('f_company').value.trim();
  const city = document.getElementById('f_city').value;
  const lpr = document.getElementById('f_lpr').value.trim();
  const status = document.getElementById('f_status').value;
  const connect = document.getElementById('f_connect').value;
  const commentText = document.getElementById('f_comment_text').value.trim();
  const commentDate = document.getElementById('f_comment_date').value || todayStr();
  const phones = formPhones.filter(ph => ph.number && ph.number.trim());

  if (!company) { showToast('⚠️ Укажите название компании'); return; }

  if (editingId !== null) {
    const p = DATA[activeSheet].find(x => x.id === editingId);
    if (p) {
      p.company = company; p.city = city; p.lpr = lpr; p.status = status; p.connect = connect;
      p.phones = phones;
      if (commentText) {
        if (!p.comments) p.comments = [];
        p.comments.push({ date: commentDate, text: commentText });
        p.lastcontact = commentDate;
      }
    }
    showToast('✅ Партнёр обновлён');
  } else {
    const rec = {
      id: idCounter++, company, city, lpr, status, connect, phones,
      lastcontact: commentText ? commentDate : '',
      comments: commentText ? [{ date: commentDate, text: commentText }] : []
    };
    DATA[activeSheet].push(rec);
    showToast('✅ Партнёр добавлен');
  }

  saveState();
  closeModal();
  renderTable();
}

function confirmYes() {
  if (pendingDeleteId !== null) {
    DATA[activeSheet] = DATA[activeSheet].filter(x => x.id !== pendingDeleteId);
    pendingDeleteId = null;
    saveState();
    renderTable();
    showToast('🗑️ Партнёр удалён');
  }
  document.getElementById('confirmOverlay').classList.remove('open');
}
function confirmNo() { pendingDeleteId = null; document.getElementById('confirmOverlay').classList.remove('open'); }

// ─── TOAST ───────────────────────────────────────────────
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

// ─── IMPORT (append, per active sheet) ──────────────────
function handleImportFile(e) {
  const file = e.target.files[0];
  if (!file) return;
  e.target.value = '';
  const reader = new FileReader();
  reader.onload = function(ev) {
    try {
      const wb = XLSX.read(new Uint8Array(ev.target.result), { type: 'array', cellDates: true });
      const json = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: '' });
      if (!json.length) { showToast('⚠️ Файл пустой'); return; }
      const added = importRows(json);
      saveState();
      renderTable();
      showToast(`✅ Добавлено ${added} строк на лист «${SHEET_DEFS.find(s=>s.key===activeSheet).label}»`);
    } catch(err) { console.error(err); showToast('⚠️ Ошибка чтения файла'); }
  };
  reader.readAsArrayBuffer(file);
}

function importRows(rows) {
  const headers = Object.keys(rows[0]);
  const fm = {
    company: ['компания','название','организация','company','наименование','партнёр','партнер'],
    city: ['город','city'],
    lpr: ['лпр','контакт','имя','contact'],
    phone: ['телефон','phone','тел','номер'],
    status: ['статус','status'],
    connect: ['связаться','дата связи','next contact','связь'],
    lastcontact: ['последний контакт','посл. контакт','lastcontact'],
    comment: ['комментарий','заметки','notes','примечание']
  };
  const cm = {};
  for (const [k, aliases] of Object.entries(fm)) {
    for (const h of headers) { if (aliases.includes(h.toLowerCase().trim())) { cm[k] = h; break; } }
  }
  let added = 0;
  rows.forEach(row => {
    const get = (k) => { const h = cm[k]; if (!h) return ''; let v = row[h]; if (v == null) return ''; if (v instanceof Date) return v.toISOString().split('T')[0]; return String(v).trim(); };
    const company = get('company');
    if (!company) return;
    const phoneRaw = get('phone');
    const phones = phoneRaw ? phoneRaw.split(/[\n,;]/).map(s=>s.trim()).filter(Boolean).map(number => ({ number, label:'' })) : [];
    const commentText = get('comment');
    const lastcontact = get('lastcontact');
    DATA[activeSheet].push({
      id: idCounter++,
      company, city: get('city'), lpr: get('lpr'),
      phones, status: STATUSES.includes(get('status')) ? get('status') : '',
      connect: get('connect'), lastcontact,
      comments: commentText ? [{ date: lastcontact || todayStr(), text: commentText }] : []
    });
    added++;
  });
  return added;
}

// ─── EXPORT (current sheet only) ────────────────────────
function exportSheet() {
  const rows = DATA[activeSheet];
  const headerRow = ['Компания','Город','ЛПР','Телефон','Статус','Связаться','Последний контакт','Комментарий'];
  const dataRows = rows.map(p => {
    const phones = (p.phones||[]).map(ph => ph.label ? `${ph.number} (${ph.label})` : ph.number).join('\n');
    const last = p.comments && p.comments.length ? p.comments[p.comments.length-1].text : '';
    return [p.company||'', p.city||'', p.lpr||'', phones, p.status||'', p.connect||'', p.lastcontact||'', last];
  });
  const ws = XLSX.utils.aoa_to_sheet([headerRow, ...dataRows]);
  ws['!cols'] = headerRow.map((h,i) => { let max=h.length; dataRows.forEach(r=>{ if(r[i] && String(r[i]).length>max) max=String(r[i]).length; }); return { wch: Math.min(max+3,50) }; });
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, SHEET_DEFS.find(s=>s.key===activeSheet).label.slice(0,31));
  const today = todayStr();
  XLSX.writeFile(wb, `база_обзвона_${SHEET_DEFS.find(s=>s.key===activeSheet).key}_${today}.xlsx`);
  showToast('✅ Файл скачан');
}

// ─── HOTKEYS ─────────────────────────────────────────────
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') {
    if (document.getElementById('confirmOverlay').classList.contains('open')) { confirmNo(); return; }
    if (document.getElementById('modalOverlay').classList.contains('open')) { closeModal(); return; }
  }
});
document.getElementById('modalOverlay').addEventListener('click', function(e) { if (e.target === this) closeModal(); });

// ─── INIT ────────────────────────────────────────────────
initStatusFilter();
const hadSaved = loadState();
if (!hadSaved) seedData();
renderTabs();
renderTable();
initFirebaseSync();
</script>
